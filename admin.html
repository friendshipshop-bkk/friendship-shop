<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หลังร้าน · Friendship Shop</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#f5b800">
<link rel="apple-touch-icon" href="admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f0; --card:#fff; --ink:#1f1d1a; --muted:#7a746a; --line:#ebe5d8;
  --accent:#f5b800; --accent-ink:#3a2c00; --green:#1e8e5a; --amber:#c27c00; --grey:#8a857c; --red:#c63d2f; --blue:#2f6fb3;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 110px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-weight:700;color:var(--accent-ink);flex:none}
h1{font-size:19px;margin:0;line-height:1.2}
.sub{font-size:12.5px;color:var(--muted)}
.hgrow{flex:1;min-width:0}
.me{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:7px;cursor:pointer;max-width:48%}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.me .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-size:12.5px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;min-width:0}
.tools input{flex:1}.tools select{max-width:40%}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px;cursor:pointer;text-align:left;width:100%}
.item:active{transform:scale(.995)}
.thumb{width:64px;height:64px;border-radius:10px;background:#f1ece1 center/cover no-repeat;flex:none;display:grid;place-items:center;color:#bdb5a5;font-size:22px}
.meta{flex:1;min-width:0}
.meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;margin-top:4px;font-weight:600}
.s-avail{background:#e3f4ea;color:var(--green)} .s-hold{background:#fdf0d6;color:var(--amber)} .s-sold{background:#eeece8;color:var(--grey)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:84px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(120,90,0,.25);cursor:pointer;font-size:15.5px}
.note{background:#fff6dc;border:1px solid #f1dfa6;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px 24px}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:none;background:#ece6d9;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.back{border:none;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:14px}
.photo{width:100%;aspect-ratio:4/3;border-radius:var(--r);background:#efe9dc center/cover no-repeat;border:1.5px dashed #d8cfbd;display:grid;place-items:center;color:var(--muted);cursor:pointer;margin-bottom:12px;overflow:hidden}
.photo.has{border-style:solid;border-color:var(--line)}
.photo span{background:rgba(255,255,255,.85);padding:6px 12px;border-radius:999px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted)}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;width:100%}
.f textarea{min-height:60px;resize:vertical}
.newcat{display:none;gap:6px;margin-top:6px}.newcat.show{display:flex}
.seg{display:flex;background:#ece6d9;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;padding:8px 4px;border-radius:9px;cursor:pointer;font-weight:500}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
.soldbox{display:none;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:10px;background:#f1eee8;border-radius:12px;padding:10px}
.soldbox.show{display:grid}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--ink);color:#fff}
.btn.grow{flex:1}
.btn.ghost{background:#ece6d9}
.btn.danger{background:#fbe6e3;color:var(--red)}
.btn.yellow{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5}
.profit{font-size:12.5px;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.audit{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1}
.ro .fab,.ro #saveBtn,.ro #delBtn,.ro #restockBtn,.ro .gadd,.ro .gx,.ro .gstar,.ro [data-sa="sell"],.ro [data-oact="next"],.ro [data-oact="cancel"],.ro [data-oact="savetrack"],.ro [data-undo],.ro [data-act="addcat"],.ro #pCatInp,.ro [data-act="up"],.ro [data-corder],.ro [data-cslip],.ro [data-cadd],.ro [data-sact="savess"]{display:none!important}
.robadge{display:none}.ro .robadge{display:inline-block;font-size:11px;font-weight:700;background:#eeece8;color:#5c5850;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
/* menu / rows */
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;text-align:left;width:100%}
.mrow .ic{font-size:19px;width:24px;text-align:center}
.mrow .lb{flex:1;font-weight:600}
.mrow .hint{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 13px}
.row .lb{flex:1;min-width:0}
.row .lb .s{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.addrow{display:flex;gap:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#e7eef8;color:var(--blue);font-weight:600;margin-left:6px}
.tag.off{background:#eeece8;color:var(--grey)}
.log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.log .h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.log .b{margin-top:2px}
.log .b b{font-weight:600}
.log .dt{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line}
.act{font-weight:700}
.act.add{color:var(--green)}.act.del{color:var(--red)}.act.edit{color:var(--blue)}.act.st{color:var(--amber)}
.muted{color:var(--muted);font-size:13px}
/* lock */
#lock{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#lock.hide{display:none}
.lockbox{width:100%;max-width:380px;text-align:center}
.lockbox .logo{width:56px;height:56px;border-radius:16px;font-size:20px;margin:0 auto 12px}
.lockbox h2{margin:0 0 4px;font-size:20px}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.who{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.who button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;min-width:90px}
.who button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 14px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pad button{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:600;cursor:pointer}
.pad button:active{background:#efe9dc}
.pad button.fn{font-size:14px;background:transparent;border-color:transparent;color:var(--muted)}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin-bottom:6px}
.lockbox .f{text-align:left;margin-bottom:10px}
/* tabs & modes */
.wrap{padding-bottom:150px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:none;background:none;padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12.5px;font-weight:600}
.tabbar button .i{font-size:21px;line-height:1.1}
.tabbar button.on{color:var(--ink)}
.tabbar button.on[data-tab="stock"]{box-shadow:inset 0 3px 0 var(--accent)}
.tabbar button.on[data-tab="sales"]{box-shadow:inset 0 3px 0 var(--green)}
.mode{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:2px}
.mode.stock{background:#fdf0c4;color:var(--accent-ink)} .mode.sales{background:#dff1e7;color:var(--green)}
body.sales .logo{background:var(--green);color:#fff}
body.sales .fab{display:none}
.view{display:none}.view.on{display:block}
.ssub{display:flex;background:#ece6d9;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.ssub button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:10px;cursor:pointer;font-weight:600}
.ssub button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ssub .n{opacity:.55;font-size:12px;margin-left:3px}
.copyall{width:100%;margin-bottom:12px;background:var(--green);color:#fff}
.scards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.scards{grid-template-columns:repeat(3,1fr)}}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.scard .ph{aspect-ratio:1;background:#f1ece1 center/cover no-repeat;display:grid;place-items:center;font-size:34px;color:#c9c0ae;position:relative}
.scard .code{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.9);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.scard .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.scard .t{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .d{font-size:12px;color:var(--muted)}
.scard .p{font-weight:700;font-size:16px;margin-top:auto;padding-top:4px}
.scard .hf{font-size:12px;color:var(--amber);font-weight:600}
.scard .bt{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px 8px}
.scard .bt .full{grid-column:1/-1}
.scard .bt button{border:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer}
.b-copy{background:#e7eef8;color:var(--blue)} .b-hold{background:#fdf0d6;color:var(--amber)} .b-sell{background:var(--green);color:#fff} .b-plain{background:#ece6d9}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.bar{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.bar .tr{height:10px;background:#f1ece1;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.bar .v small{color:var(--muted);font-weight:500}
.srow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.srow:first-of-type{border-top:none}
.srow .s{font-size:12px;color:var(--muted)}
.chch{display:flex;flex-wrap:wrap;gap:6px}
.chch button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600}
.chch button.on{background:var(--green);color:#fff;border-color:var(--green)}
.cap{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:14px;line-height:1.55}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px}

/* ===== desktop ===== */
.xc,.lhead,.sidebrand,.kbd{display:none}
@media(min-width:1024px){
  body{font-size:15px}
  .tabbar{top:0;bottom:0;right:auto;width:232px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding:18px 14px;gap:4px;justify-content:flex-start;background:#fff}
  .sidebrand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .sidebrand .logo{width:36px;height:36px}
  .sidebrand b{display:block;font-size:15px}.sidebrand small{color:var(--muted);font-size:12px}
  .tabbar button{flex:none;flex-direction:row;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;justify-content:flex-start;color:var(--muted)}
  .tabbar button .i{font-size:19px}
  .tabbar button:hover{background:var(--bg)}
  .tabbar button.on{background:var(--bg)}
  .tabbar button.on[data-tab="stock"]{box-shadow:inset 3px 0 0 var(--accent)}
  .tabbar button.on[data-tab="sales"]{box-shadow:inset 3px 0 0 var(--green)}
  .kbd{display:block;margin-top:auto;font-size:12px;color:var(--muted);line-height:1.8;padding:0 6px}
  .kbd kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-family:inherit}
  .wrap{max-width:none;margin-left:232px;padding:24px 36px 60px}
  header .logo{display:none}
  h1{font-size:24px}
  .stats{grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{padding:14px 16px}.stat .v{font-size:24px}
  .tools input{max-width:420px}
  .chips{margin-bottom:12px}
  /* stock table */
  .list{gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .lhead,.item{display:grid;grid-template-columns:52px minmax(200px,2fr) 1.1fr .8fr 1fr 1.3fr;gap:14px;align-items:center}
  .lhead{padding:10px 14px;font-size:12.5px;color:var(--muted);font-weight:600;background:#fbf9f4;border-bottom:1px solid var(--line)}
  .item{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:8px 14px}
  .item:last-child{border-bottom:none}
  .item:hover{background:#fcfaf5}
  .item:active{transform:none}
  .thumb{width:52px;height:52px;font-size:18px}
  .xc{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xc.by{font-size:12.5px;color:var(--muted)}
  .item .right{text-align:left;display:flex;align-items:center;gap:8px}
  .item .right .pill{margin-top:0}
  .empty{background:var(--card)}
  /* sales */
  .ssub{max-width:560px}
  .scards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .copyall{width:auto;padding:11px 20px}
  #salesList .tools{max-width:none}
  #salesSum{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  #salesSum>.chips,#salesSum>.sumgrid{grid-column:1/-1}
  #salesSum>.card:last-child{grid-column:1/-1}
  .sumgrid{grid-template-columns:repeat(4,1fr);gap:12px}
  .bar{grid-template-columns:130px 1fr auto}
  .fab{bottom:28px;right:36px}
  /* sheets as centered dialogs */
  .scrim{align-items:center}
  .sheet{border-radius:20px;max-width:560px;padding:22px 24px 26px}
  .sheet.itemsheet{max-width:960px;display:grid;grid-template-columns:340px 1fr;gap:0 24px;align-content:start}
  .itemsheet>h2{grid-column:1/-1}
  .itemsheet>.gal{grid-column:1;grid-row:2/span 3;align-self:start;grid-template-columns:repeat(2,1fr)}
  .itemsheet>.grid,.itemsheet>.actions,.itemsheet>.audit{grid-column:2}
  .me{max-width:260px}
  .toast{bottom:40px;left:calc(50% + 116px)}
}

/* ===== orders + customer app ===== */
body.orders .logo{background:#7a4fc0;color:#fff} body.cust .logo{background:#e0567a;color:#fff}
body:not(.stockv) .fab{display:none}
.mode.orders{background:#efe7fa;color:#7a4fc0}.mode.cust{background:#fde6ec;color:#c23d62}
.tabbar button{position:relative}
.tabbar .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}
.ocards{display:flex;flex-direction:column;gap:8px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;text-align:left;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.ocard .ot,.c-order .ot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ocard .ot .pill,.c-order .ot .pill{margin-top:0}
.ocard .om{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .ob{display:flex;justify-content:space-between;font-size:13px;margin-top:2px}
.steps{display:flex;margin:4px 0 14px}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);position:relative;text-align:center}
.stp i{width:14px;height:14px;border-radius:50%;background:#e4ddce;display:block;z-index:1}
.stp:not(:first-child)::before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:#e4ddce}
.stp.done i{background:var(--green)} .stp.done:not(:first-child)::before{background:var(--green)} .stp.done{color:var(--ink)}
.steps.sm{margin:8px 0}.steps.sm .stp{font-size:10px}

}
function sel(name,q){const m=T[name];let s=sb.from(m.t).select("*");
  for(const w of (q.where||[])){const f=snake(w[0]);s=w[1]==="=="?s.eq(f,w[2]):w[1]==="!="?s.neq(f,w[2]):w[1]===">"?s.gt(f,w[2]):w[1]===">="?s.gte(f,w[2]):w[1]==="<"?s.lt(f,w[2]):w[1]==="<="?s.lte(f,w[2]):w[1]==="in"?s.in(f,w[2]):s}
  if(q.orderBy)s=s.order(snake(q.orderBy[0]),{ascending:q.orderBy[1]!=="desc"});if(q.limit)s=s.limit(q.limit);return s}
async function fetchList(name,q){
  const m=T[name];const rows=chk(await sel(name,q));
  if(name!=="items")return rows.map(r=>({id:r[m.pk],data:fromRow(r)}));
  const cs=(await sb.from("fs_costs").select("*")).data||[];const cm=Object.fromEntries(cs.map(c=>[c.id,c]));
  return rows.map(r=>({id:r.id,data:{...fromRow(r),cost:cm[r.id]?Number(cm[r.id].cost):0,note:cm[r.id]?cm[r.id].note:""}}));
}
function docRef(name,id){
  const m=T[name];
  return {id,path:name+"/"+id,
    async get(){const list=await fetchList(name,{where:[[name==="orders"?"code":"id","==",id]]});return docSnap(id,list[0]?list[0].data:null)},
    async set(d){
      if(name==="items"){const r=toRow("fs_products",d);r.id=id;chkw(await sb.from("fs_products").upsert(r));chkw(await sb.from("fs_costs").upsert({id,cost:Number(d.cost)||0,note:d.note||""}));return}
      const r=toRow(m.t,d);r[m.pk]=id;chkw(await sb.from(m.t).upsert(r));
    },
    async update(d){
      if(name==="items"){const r=toRow("fs_products",d);delete r.id;if(Object.keys(r).length)chkw(await sb.from("fs_products").update(r).eq("id",id));
        if("cost" in d||"note" in d){const c={id};if("cost" in d)c.cost=Number(d.cost)||0;if("note" in d)c.note=d.note||"";chkw(await sb.from("fs_costs").upsert(c))}return}
      const r=toRow(m.t,d);delete r[m.pk];if(Object.keys(r).length)chkw(await sb.from(m.t).update(r).eq(m.pk,id));
    },
    async delete(){chkw(await sb.from(m.t).delete().eq(m.pk,id))},
    onSnapshot(cb,err){return watch(name==="items"?["fs_products","fs_costs"]:[m.t],async()=>{const s=await this.get();cb(s)},err)},
    async acquire(){return {acquired:true}},
  };
}
function col(name,q={}){
  return {path:name,
    orderBy:(f,d)=>col(name,{...q,orderBy:[f,d||"asc"]}),limit:n=>col(name,{...q,limit:n}),
    where:(f,o,v)=>col(name,{...q,where:[...(q.where||[]),[f,o,v]]}),
    doc:id=>docRef(name,id||uuid()),
    add:async d=>{const r=docRef(name,uuid());await r.set(d);return r},
    get:async()=>qSnap(await fetchList(name,q)),
    onSnapshot:(cb,err)=>watch(name==="items"?["fs_products","fs_costs"]:[T[name].t],async()=>cb(qSnap(await fetchList(name,q))),err),
  };
}
function cfgDoc(id){return {
  async get(){const r=chk(await sb.from("fs_config").select("data").eq("id",id).maybeSingle());return docSnap(id,r?r.data:null)},
  async set(d){const data=clean(d);const up=chkw(await sb.from("fs_config").update({data,updated_at:new Date().toISOString()}).eq("id",id).select("id"));
    if(!up||!up.length)chkw(await sb.from("fs_config").insert({id,data}))},
  async update(d){const cur=await this.get();await this.set({...(cur.data()||{}),...d})},
  onSnapshot(cb,err){return watch(["fs_config"],async()=>cb(await this.get()),err)},
}}
const db={collection:n=>col(n),doc:p=>{const [c,id]=p.split("/");return c==="settings"?cfgDoc(id):docRef(c,id)}};
// images
async function toJpeg(blob,max,q){const bmp=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",q))}
const assets={async upload(blob){const id=uuid();const [f,t]=await Promise.all([toJpeg(blob,1000,0.8),toJpeg(blob,320,0.72)]);
  chk(await sb.storage.from("fs-products").upload(id+".jpg",f,{contentType:"image/jpeg",upsert:true}));
  chk(await sb.storage.from("fs-products").upload(id+"_t.jpg",t,{contentType:"image/jpeg",upsert:true}));
  return {id,url:"",sizeBytes:f.size,contentType:"image/jpeg"}}};
const pub=p=>sb.storage.from("fs-products").getPublicUrl(p).data.publicUrl;
async function fetchImage(key){const i=key.indexOf(":"),kind=key.slice(0,i),id=key.slice(i+1);
  if(id.startsWith("sp:")){const r=await sb.storage.from("fs-slips").createSignedUrl(id.slice(3),3600);return r.data?r.data.signedUrl:""}
  return pub(id+(kind==="t"?"_t.jpg":".jpg"))}
const downloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return {status:"saved"}}};
let role=null;
const user={can:async()=>role!=="viewer",id:async()=>null};
// auth
const adminUrl=()=>location.origin+location.pathname;
const ERRMAP=[[/invalid login credentials/i,"auth/invalid-credential"],[/already registered|already been registered/i,"auth/email-already-in-use"],[/email not confirmed/i,"auth/email-not-confirmed"],
  [/password should be|password is too short/i,"auth/weak-password"],[/rate limit|too many/i,"auth/too-many-requests"],[/invalid.*email|unable to validate email/i,"auth/invalid-email"],
  [/signups? not allowed|disabled/i,"auth/operation-not-allowed"],[/failed to fetch|network/i,"auth/network-request-failed"]];
const mapErr=e=>{const m=(e&&e.message)||"";const f=ERRMAP.find(x=>x[0].test(m));const o=new Error(m);o.code=f?f[1]:"auth/other";return o};
const U=s=>s&&s.user?{uid:s.user.id,email:(s.user.email||"").toLowerCase(),isAnonymous:!s.user.email}:null;
const auth={
  onChange(cb){sb.auth.getSession().then(({data})=>cb(U(data.session)));const {data}=sb.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY")window.__fsRecovery=true;if(ev!=="TOKEN_REFRESHED")cb(U(s))});return ()=>data.subscription.unsubscribe()},
  async login(e,p){const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw mapErr(error)},
  async signup(e,p){const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:adminUrl()}});if(error)throw mapErr(error);if(!data.session){const o=new Error("confirm");o.code="auth/confirm-email";throw o}},
  logout:()=>sb.auth.signOut(),
  async reset(e){const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:adminUrl()});if(error)throw mapErr(error)},
  async updatePassword(p){const {error}=await sb.auth.updateUser({password:p});if(error)throw mapErr(error)},
};
const store={watchDoc:(p,cb,err)=>{const d=cfgDoc(p.split("/")[1]);return d.onSnapshot(s=>cb({exists:s.exists,data:s.data()}),err)}};
const rpc=async(fn,args)=>chkw(await sb.rpc(fn,args||{}));
window.__beResolve({sb,DEMO:false,conn,B:{auth,store},fetchImage,rpc,setRole:r=>{role=r},
  claimOwner:(name,app)=>rpc("fs_claim_owner",{p_name:name,p_app:app}),saveStaff:m=>rpc("fs_save_staff",{p_members:m}),
  use:n=>n==="db"?db:n==="assets"?assets:n==="downloads"?downloads:n==="user"?user:null});
})();
</script>
<script>
(function(){
const DEFAULT_CATS=["เสื้อกันหนาว","เสื้อบุนวม","สเวตเตอร์","เสื้อผ้าร่ม","เสื้อโค้ท","เสื้อผู้หญิง","เสื้อผู้ชาย","กางเกง","กระโปรง/เดรส","หมวก","รองเท้า","กระเป๋า","กิ๊บช็อป/เครื่องประดับผม","แว่นตา","เครื่องประดับ","เครื่องสำอาง","ผ้าพันคอ/ถุงมือ","ผ้าห่ม/บุนวม","อื่นๆ"];
const IDLE_MIN=20;
const $=id=>document.getElementById(id);
let db=null, assets=null, canWrite=true, baseWrite=true;
let items=[], staff=[], logs=[], cats=DEFAULT_CATS.slice(), settingsExists=false, staffLoaded=false;
let appSettings={}, tab="stock", salesSub="avail", sumPeriod="month", panelCtx=null;
let me=null, filter="all", editing=null, uploading=false, panelView=null, logQ="";

const baht=n=>"฿"+(Math.round(n||0)).toLocaleString("th-TH");
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const when=t=>t?new Date(t).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200)}
function note(t){const el=$("note");el.textContent=t||"";el.style.display=t?"block":"none"}
const ss={get(k){try{return sessionStorage.getItem(k)}catch(_){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(_){}}};
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hash(salt,pin){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const isAdmin=()=>me&&me.role==="admin";
const ROLES={admin:"ผู้ดูแล",staff:"พนักงาน",viewer:"ผู้ชม (ดูอย่างเดียว)"};
const FORM_IDS=["fCode","fCat","fName","fBrand","fSize","fCost","fPrice","fQty","fLow","fActive","fNote","fDesc"];
function applyAccess(){
  canWrite=baseWrite&&!(me&&me.role==="viewer");
  document.body.classList.toggle("ro",!canWrite);
  FORM_IDS.forEach(id=>{const el=$(id);if(el)el.disabled=!canWrite});
}

/* ---------- activity log ---------- */
async function log(action,kind,target,detail){
  if(!db||!me)return;
  try{await db.collection("logs").doc().set({at:Date.now(),by:me.name,byId:me.id,action,kind,target:target||"",detail:detail||""})}catch(_){}
}
const LABEL={code:"รหัส",category:"หมวด",name:"ชื่อ",brand:"แบรนด์",size:"ไซซ์/สี",cost:"ทุน",price:"ราคาขาย",qty:"สต็อก",low:"เตือนใกล้หมด",active:"แสดงในร้าน",desc:"รายละเอียดลูกค้า",note:"หมายเหตุ",photos:"รูป"};
function diff(a,b){
  const out=[];
  for(const k of Object.keys(LABEL)){
    if(k==="photos"){const x=JSON.stringify(photosOf(a)),y=JSON.stringify(b.photos||[]);if(x!==y)out.push(`แก้ไขรูป (${(b.photos||[]).length} รูป)`);continue}
    if(k==="active"){if((a.active!==false)!==(b.active!==false))out.push(`แสดงในร้าน: ${b.active!==false?"เปิด":"ปิด"}`);continue}
    const x=a[k]??"",y=b[k]??"";
    if(String(x)===String(y))continue;
    if(k==="note")out.push("แก้หมายเหตุ");
    else if(k==="desc")out.push("แก้รายละเอียดสำหรับลูกค้า");
    else if(k==="cost"||k==="price")out.push(`${LABEL[k]}: ${x===""?"-":baht(x)} → ${y===""?"-":baht(y)}`);
    else out.push(`${LABEL[k]}: ${x===""?"-":x} → ${y===""?"-":y}`);
  }
  return out;
}

/* ---------- categories ---------- */
function fillCatSelects(keep){
  const cur=$("cat").value;
  $("cat").innerHTML='<option value="">ทุกหมวด</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  $("cat").value=cats.includes(cur)?cur:"";
  const sc=$("scat").value;$("scat").innerHTML=$("cat").innerHTML;$("scat").value=cats.includes(sc)?sc:"";
  const list=cats.slice(); if(keep&&!list.includes(keep))list.push(keep);
  $("fCat").innerHTML=list.map(c=>`<option>${esc(c)}</option>`).join("")+'<option value="__new">＋ เพิ่มหมวดใหม่…</option>';
}
async function saveSettings(patch){
  const next={...appSettings,categories:cats,...patch,updatedAt:Date.now(),updatedBy:me?me.name:""};
  await db.doc("settings/app").set(next);appSettings=next;
}
async function saveCats(next){await saveSettings({categories:next})}
async function addCat(name){
  if(!canWrite)return false;
  name=(name||"").trim(); if(!name)return false;
  if(cats.includes(name)){toast("มีหมวดนี้แล้ว");return true}
  try{await saveCats([...cats,name]);cats=[...cats,name];log("เพิ่มหมวด","add",name);toast("เพิ่มหมวด “"+name+"” แล้ว");return true}
  catch(_){toast("เพิ่มหมวดไม่สำเร็จ");return false}
}

/* ---------- stock helpers ---------- */
const avail=it=>Math.max(0,num(it.qty)-num(it.reserved));
const lowOf=it=>it.low!=null&&it.low!==""?num(it.low):(appSettings.lowStock!=null?num(appSettings.lowStock):3);
const photosOf=it=>Array.isArray(it.photos)&&it.photos.length?it.photos:(it.photoId?[it.photoId]:[]);
const cover=it=>photosOf(it)[0]||null;
const blobUrl=id=>"/_blob/"+encodeURIComponent(id);
const bg=id=>id?`data-img="t:${esc(id)}"`:"";
const ilabel=it=>[it.code,it.name].filter(Boolean).join(" ");
let sales=[], agingDays=30;
function lastSaleMap(){const m={};for(const s of sales){const t=s.at||0;if(!m[s.itemId]||m[s.itemId]<t)m[s.itemId]=t}return m}
const idleDays=(it,lsm)=>Math.floor((Date.now()-Math.max(lsm[it.id]||0,it.createdAt||0))/86400000);
function stockPill(it){const a=avail(it);if(a<=0)return '<span class="pill s-sold">หมด</span>';return `<span class="pill ${a<=lowOf(it)?"s-hold":"s-avail"}">เหลือ ${a}</span>`}

/* ---------- main render (stock) ---------- */
function stockFiltered(){
  const lsm=lastSaleMap();
  const q=$("q").value.trim().toLowerCase(), cat=$("cat").value;
  let list=items.filter(it=>{
    const a=avail(it);
    if(filter==="in"&&a<=0)return false;
    if(filter==="low"&&!(a>0&&a<=lowOf(it)))return false;
    if(filter==="out"&&a>0)return false;
    if(filter==="aging"&&!(num(it.qty)>0&&idleDays(it,lsm)>=agingDays))return false;
    if(filter==="hidden"&&it.active!==false)return false;
    return (!cat||it.category===cat)&&(!q||[it.code,it.name,it.brand,it.size,it.note].join(" ").toLowerCase().includes(q));
  });
  if(filter==="aging")list.sort((a,b)=>idleDays(b,lsm)-idleDays(a,lsm));
  return {list,lsm};
}
function render(){
  let units=0,cost=0,low=0,out=0;
  const lsm=lastSaleMap();
  for(const it of items){units+=num(it.qty);cost+=num(it.qty)*num(it.cost);const a=avail(it);if(a<=0)out++;else if(a<=lowOf(it))low++}
  const aged=items.filter(it=>num(it.qty)>0&&idleDays(it,lsm)>=agingDays);
  const hidden=items.filter(it=>it.active===false).length;
  $("stTotal").innerHTML=items.length+' <small>รายการ</small>';
  $("stAvail").innerHTML=units.toLocaleString("th-TH")+' <small>ชิ้น</small>';
  $("stHold").innerHTML=`${low} <small>/</small> ${out}`;
  $("stCost").textContent=baht(cost);
  const counts={all:items.length,in:items.length-out,low,out,aging:aged.length,hidden};
  const defs=[["all","ทั้งหมด"],["in","มีของ"],["low","⚠️ ใกล้หมด"],["out","หมด"],["aging","🐢 ค้างนาน"]].concat(hidden?[["hidden","ซ่อนอยู่"]]:[]);
  $("chips").innerHTML=defs.map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}<span class="n">${counts[k]||0}</span></button>`).join("");
  const ag=$("agechips");
  if(filter==="aging"){
    const tied=aged.reduce((s,it)=>s+num(it.qty)*num(it.cost),0);
    ag.style.display="";ag.innerHTML=`<span class="muted" style="align-self:center">ไม่มียอดขายมา</span>`+[30,60,90].map(d=>`<button class="chip ${agingDays===d?"on":""}" data-ad="${d}">≥ ${d} วัน</button>`).join("")+`<span class="muted" style="align-self:center;margin-left:4px">ทุนจม ${baht(tied)}</span>`;
  }else{ag.style.display="none"}
  renderSales();renderOrders();renderCust();
  const {list:shown}=stockFiltered();
  if(!items.length){$("list").innerHTML='<div class="empty">ยังไม่มีสินค้า<br>กด “＋ เพิ่มสินค้า” เพื่อเริ่มลงสต็อก</div>';return}
  if(!shown.length){$("list").innerHTML=`<div class="empty">${filter==="aging"?"ไม่มีสินค้าค้างนานในช่วงนี้ 👍":"ไม่พบสินค้า"}</div>`;return}
  $("list").innerHTML='<div class="lhead"><span></span><span>สินค้า</span><span>หมวด</span><span>คงเหลือ</span><span>ราคา</span><span>แก้ไขล่าสุด</span></div>'+shown.map(it=>{
    const c=cover(it),n=photosOf(it).length;
    const d=[it.code,it.brand,it.size].filter(Boolean).map(esc).join(" · ");
    const idle=filter==="aging"?`<div class="d" style="color:var(--amber)">ไม่มีขาย ${idleDays(it,lsm)} วัน · ทุนจม ${baht(num(it.qty)*num(it.cost))}</div>`:"";
    const res=num(it.reserved)?` · จอง ${num(it.reserved)}`:"";
    return `<button class="item" data-id="${esc(it.id)}"><div class="thumb" ${bg(c)}>${c?(n>1?`<span class="pn">${n}</span>`:""):"📦"}</div>
      <div class="meta"><div class="t">${it.active===false?'<span class="muted">[ซ่อน]</span> ':""}${esc(it.name||"(ไม่มีชื่อ)")}</div><div class="d">${d||esc(it.category||"")}</div>${idle}</div>
      <span class="xc">${esc(it.category||"-")}</span><span class="xc">${num(it.qty)} ชิ้น${res}</span>
      <div class="right"><div class="price">${baht(it.price)}</div>${stockPill(it)}</div>
      <span class="xc by">${esc(it.updatedBy||it.createdBy||"-")}${it.updatedAt?" · "+when(it.updatedAt):""}</span></button>`;
  }).join("");
}
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){filter=b.dataset.f;render()}});
$("agechips").addEventListener("click",e=>{const b=e.target.closest("[data-ad]");if(b){agingDays=+b.dataset.ad;render()}});
$("q").addEventListener("input",render);$("cat").addEventListener("change",render);
$("q").addEventListener("keydown",e=>{ // barcode scanner: exact code + Enter opens the product
  if(e.key!=="Enter")return;const v=$("q").value.trim().toLowerCase();const it=items.find(i=>(i.code||"").toLowerCase()===v);if(it){e.preventDefault();openSheet(it)}});
$("list").addEventListener("click",e=>{const b=e.target.closest(".item");if(b)openSheet(items.find(i=>i.id===b.dataset.id))});
$("labelsBtn").onclick=()=>{const {list}=stockFiltered();const l=list.filter(it=>num(it.qty)>0);openLabels((l.length?l:list).slice(0,60).map(it=>({id:it.id,n:1})))};

/* ---------- item sheet ---------- */
function nextCode(){let max=0;for(const it of items){const m=/^FS-?(\d+)$/i.exec(it.code||"");if(m)max=Math.max(max,+m[1])}return "FS-"+String(max+1).padStart(4,"0")}
function profitHint(){const c=num($("fCost").value),p=num($("fPrice").value);$("profitHint").textContent=(c||p)?`กำไรต่อชิ้น ${baht(p-c)}${p?` (${Math.round((p-c)/p*100)}%)`:""}`:""}
["fCost","fPrice"].forEach(id=>$(id).addEventListener("input",profitHint));
let lastCat=DEFAULT_CATS[0];
$("fCat").addEventListener("change",()=>{
  if($("fCat").value==="__new"){$("newCatRow").classList.add("show");$("newCatInp").value="";$("newCatInp").focus();$("fCat").value=lastCat}
  else{lastCat=$("fCat").value;$("newCatRow").classList.remove("show")}
});
$("newCatBtn").onclick=async e=>{e.preventDefault();const n=$("newCatInp").value.trim();if(!n)return;
  if(await addCat(n)){fillCatSelects(n);$("fCat").value=n;lastCat=n;$("newCatRow").classList.remove("show")}};
let gal=[], openQty=null, delArmed=false;
const MAXP=8;
function renderGal(){
  $("gal").innerHTML=gal.map((id,i)=>`<div class="gp" ${bg(id)}>${i===0?'<span class="cv">รูปปก</span>':`<button class="gstar" data-gi="${i}" title="ตั้งเป็นรูปปก">★</button>`}<button class="gx" data-gx="${i}" title="ลบรูป">✕</button></div>`).join("")
    +(gal.length<MAXP?`<button class="gadd" id="gadd">📷<span>${gal.length?"เพิ่มรูป":"ใส่รูปสินค้า"}</span><small>${gal.length}/${MAXP}</small></button>`:"");
}
$("gal").addEventListener("click",e=>{

async function shrink(file,max){
  const bmp=await createImageBitmap(file);const k=Math.min(1,(max||1200)/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}

    try{let b=files[i];try{b=await shrink(files[i])}catch(_){} const r=await assets.upload(b);gal.push(r.id)}catch(_){toast("อัปโหลดรูปไม่สำเร็จบางรูป")}

$("saveBtn").onclick=async()=>{
  if(!db||uploading||!me||!canWrite)return;
  const now=Date.now();
  const data={
    code:$("fCode").value.trim(),category:$("fCat").value==="__new"?lastCat:$("fCat").value,name:$("fName").value.trim(),
    brand:$("fBrand").value.trim(),size:$("fSize").value.trim(),cost:num($("fCost").value),price:num($("fPrice").value),
    low:$("fLow").value===""?null:Math.floor(num($("fLow").value)),active:$("fActive").checked,
    note:$("fNote").value.trim(),desc:$("fDesc").value.trim(),photos:gal.slice(),photoId:gal[0]||null,
    updatedAt:now,updatedBy:me.name,updatedById:me.id,
  };
  const qtyNew=Math.max(0,Math.floor(num($("fQty").value)));
  if(!data.name&&!data.code){toast("ใส่ชื่อหรือรหัสสินค้าก่อน");return}
  if(data.code&&items.some(i=>i.code===data.code&&(!editing||i.id!==editing.id))){toast("รหัสนี้ซ้ำกับสินค้าอื่น");return}
  $("saveBtn").disabled=true;
  try{
    if(editing){
      const qtyChanged=qtyNew!==openQty;
      if(qtyChanged)data.qty=qtyNew;
      const ch=diff(editing,{...editing,...data});
      if(!ch.length){toast("ไม่มีอะไรเปลี่ยน");$("saveBtn").disabled=false;closeSheet();return}
      await db.collection("items").doc(editing.id).update(data);
      log(qtyChanged&&ch.length===1?"ปรับสต็อก":"แก้ไข",qtyChanged&&ch.length===1?"st":"edit",ilabel(data),ch.join("\n"));
    }else{
      await db.collection("items").doc().set({...data,qty:qtyNew,reserved:0,lastInAt:now,createdAt:now,createdBy:me.name,createdById:me.id});
      log("เพิ่มสินค้า","add",ilabel(data),[data.category,baht(data.price),qtyNew+" ชิ้น"].join(" · "));
    }
    toast("บันทึกแล้ว");closeSheet();
  }catch(err){toast(err&&err.code==="quota_exceeded"?"พื้นที่เก็บข้อมูลเต็ม":"บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง")}

};

        for(const it of affected){await db.collection("items").doc(it.id).update({category:nn})}
        log("เปลี่ยนชื่อหมวด","edit",`${old} → ${nn}`,affected.length?`ย้ายสินค้า ${affected.length} ชิ้น`:"");

    try{await saveCats(n);cats=n;log("ลบหมวด","del",c);fillCatSelects();toast("ลบหมวดแล้ว (สินค้าเดิมยังอยู่)");renderPanel()}catch(_){toast("ลบไม่สำเร็จ")}return;

    t.disabled=false;return;

    if(!t.dataset.armed){t.dataset.armed="1";t.textContent="ยืนยันนำออก";return}

function periodRange(p){
  const d=new Date(),ym=today().slice(0,7);
  if(p==="today")return s=>s===today();
  if(p==="month")return s=>s.slice(0,7)===ym;
  if(p==="last"){const x=new Date(d.getFullYear(),d.getMonth()-1,1);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");return s=>s.slice(0,7)===k}
  if(p==="7d"){const x=new Date(d);x.setDate(x.getDate()-6);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");return s=>s>=k}
  return ()=>true;
}
function bars(map,total,unit){
  const rows=Object.entries(map).sort((a,b)=>b[1].rev-a[1].rev);
  if(!rows.length)return '<div class="muted">ยังไม่มีข้อมูล</div>';
  const max=Math.max(...rows.map(r=>r[1].rev),1);
  return rows.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="tr"><i style="width:${Math.max(3,v.rev/max*100)}%"></i></span><span class="v">${baht(v.rev)} <small>${v.n} ชิ้น${total?` · ${Math.round(v.rev/total*100)}%`:""}</small></span></div>`).join("");
}

async function getItem(id){const d=await db.collection("items").doc(id).get();return d.exists?{id,...d.data()}:null}
async function setOrderStatus(o,to,extra,note,byName){
  const now=Date.now(),by=byName||(me&&me.name)||"ระบบ";
  const hist=[...(o.history||[]),{s:to,at:now,by,note:note||""}];
  let stockState=o.stockState||"reserved";
  if(to==="paid"&&stockState==="reserved"){
    for(const l of (o.items||[])){const it=await getItem(l.id);if(!it)continue;const n=lineQty(l);
      await db.collection("items").doc(it.id).update({qty:Math.max(0,num(it.qty)-n),reserved:Math.max(0,num(it.reserved)-n),updatedAt:now,updatedBy:by});
      await addSale({...it,cost:it.cost},n,l.price,"แอปลูกค้า",today(),o.code)}
    stockState="deducted";
  }
  if(to==="cancelled"){
    if(stockState==="reserved"){for(const l of (o.items||[])){const it=await getItem(l.id);if(it)await db.collection("items").doc(it.id).update({reserved:Math.max(0,num(it.reserved)-lineQty(l)),updatedAt:now,updatedBy:by})}}
    else if(stockState==="deducted"){
      for(const l of (o.items||[])){const it=await getItem(l.id);if(it)await db.collection("items").doc(it.id).update({qty:num(it.qty)+lineQty(l),updatedAt:now,updatedBy:by})}
      try{const sn=await db.collection("sales").where("orderId","==",o.code).get();for(const d of sn.docs)await db.collection("sales").doc(d.id).delete()}catch(_){}
    }
    stockState="released";
  }
  await db.collection("orders").doc(o.code).update({status:to,history:hist,stockState,updatedAt:now,updatedBy:by,...(extra||{})});
  if(byName)logAs(byName,"ออเดอร์: "+OS[to],to==="cancelled"?"del":"st",o.code,[o.name,note].filter(Boolean).join(" · "));
  else log("ออเดอร์: "+OS[to],to==="cancelled"?"del":"st",o.code,[o.name,note].filter(Boolean).join(" · "));
}

function segs(text){
  try{if(window.Intl&&Intl.Segmenter){return [...new Intl.Segmenter("th",{granularity:"word"}).segment(text)].map(s=>s.segment)}}catch(_){}
  return [...text];
}
function wrap(ctx,text,maxW){
  const out=[];
  for(const para of String(text||"").split(/\n/)){
    let line="";
    for(const w of segs(para)){
      const t=line+w;
      if(ctx.measureText(t).width>maxW&&line){out.push(line.trimEnd());line=w.trimStart()}
      else line=t;
      while(ctx.measureText(line).width>maxW&&line.length>1){let k=line.length-1;while(k>1&&ctx.measureText(line.slice(0,k)).width>maxW)k--;out.push(line.slice(0,k));line=line.slice(k)}
    }
    out.push(line.trimEnd());
  }
  return out;
}
const FONT='"IBM Plex Sans Thai", sans-serif';
function drawLabel(o){
  const W=1000,H=1500,P=56,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#111";x.textBaseline="top";
  x.lineWidth=6;x.strokeStyle="#111";x.strokeRect(18,18,W-36,H-36);
  let y=P;
  // header bar
  x.fillRect(18,18,W-36,120);x.fillStyle="#fff";x.font=`700 54px ${FONT}`;x.fillText(appSettings.shopName||"Friendship Shop",P,48);
  x.font=`600 40px ${FONT}`;const cw=x.measureText(o.code).width;x.fillText(o.code,W-P-cw,56);x.fillStyle="#111";
  y=170;
  x.font=`600 38px ${FONT}`;x.fillStyle="#555";x.fillText("ผู้รับ",P,y);x.fillStyle="#111";y+=56;
  x.font=`700 72px ${FONT}`;for(const l of wrap(x,o.name,W-2*P).slice(0,2)){x.fillText(l,P,y);y+=88}
  x.font=`700 60px ${FONT}`;x.fillText("โทร "+(o.phone||""),P,y);y+=92;
  x.font=`500 50px ${FONT}`;const addr=wrap(x,o.address,W-2*P);const al=addr.slice(0,9);for(const l of al){x.fillText(l,P,y);y+=66}
  if(addr.length>9){x.fillText("…",P,y);y+=66}
  y=Math.max(y+24,960);
  x.lineWidth=4;x.setLineDash([18,14]);x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();x.setLineDash([]);y+=34;
  x.font=`600 34px ${FONT}`;x.fillStyle="#555";x.fillText("ผู้ส่ง",P,y);x.fillStyle="#111";y+=50;
  x.font=`500 40px ${FONT}`;for(const l of wrap(x,appSettings.senderText||appSettings.shopName||"Friendship Shop",W-2*P).slice(0,3)){x.fillText(l,P,y);y+=54}
  y+=20;x.lineWidth=3;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();y+=26;
  x.font=`500 32px ${FONT}`;x.fillStyle="#333";
  const itl=`สินค้า ${(o.items||[]).reduce((t,i)=>t+lineQty(i),0)} ชิ้น: `+(o.items||[]).map(i=>(i.code||i.name)+(lineQty(i)>1?"×"+lineQty(i):"")).join(", ");
  for(const l of wrap(x,itl,W-2*P).slice(0,3)){x.fillText(l,P,y);y+=44}
  if(o.note){for(const l of wrap(x,"หมายเหตุ: "+o.note,W-2*P).slice(0,2)){x.fillText(l,P,y);y+=44}}
  return c;
}

const C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(text){ // Code 128 set B → array of bar/space widths (modules)
  const vals=[104];for(const ch of String(text)){const c=ch.charCodeAt(0);vals.push(c>=32&&c<=127?c-32:0)}
  let sum=104;for(let i=1;i<vals.length;i++)sum+=vals[i]*i;vals.push(sum%103);vals.push(106);
  return vals.map(v=>C128[v]).join("").split("").map(Number);
}
function drawBarcode(x,text,left,top,maxW,h){
  const w=code128(text),mods=w.reduce((a,b)=>a+b,0)+20;const m=Math.max(1,Math.floor(maxW/mods));
  let cx=left+Math.round((maxW-mods*m)/2)+10*m;x.fillStyle="#000";
  w.forEach((n,i)=>{if(i%2===0)x.fillRect(cx,top,n*m,h);cx+=n*m});
}
const LSIZES={s5030:{name:"50×30 มม.",sub:"สติกเกอร์ม้วน / เครื่องปริ้นความร้อน",mm:[50,30],px:[600,360]},a4:{name:"A4 24 ดวง",sub:"สติกเกอร์แผ่น 70×37 มม.",mm:[70,37],px:[700,370]}};
function drawProductLabel(it,size,showPrice){
  const [W,H]=LSIZES[size].px,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#111";x.textBaseline="top";
  const P=Math.round(W*0.045);
  x.font=`600 ${Math.round(H*0.075)}px ${FONT}`;x.fillStyle="#666";x.fillText(appSettings.shopName||"Friendship Shop",P,P*0.7);
  let right=W-P;
  if(showPrice){x.fillStyle="#111";x.font=`700 ${Math.round(H*0.15)}px ${FONT}`;const t="฿"+nf(it.price);const tw=x.measureText(t).width;x.fillText(t,W-P-tw,P*0.5);right=W-P-tw-P*0.6}
  x.fillStyle="#111";x.font=`700 ${Math.round(H*0.105)}px ${FONT}`;
  let y=P*0.7+H*0.11;
  const nl=wrap(x,it.name||"",(showPrice?right:W-P)-P).slice(0,2);nl.forEach((l,i)=>{x.fillText(l,P,y);y+=H*0.125});
  if(it.size){x.font=`500 ${Math.round(H*0.085)}px ${FONT}`;x.fillStyle="#444";x.fillText(wrap(x,it.size,W-2*P)[0],P,y);y+=H*0.1}
  const bh=Math.round(H*0.26),by=H-P*0.6-H*0.11-bh;
  drawBarcode(x,it.code||it.id,P,by,W-2*P,bh);
  x.fillStyle="#111";x.font=`600 ${Math.round(H*0.085)}px ${FONT}`;const ct=it.code||"";const cw=x.measureText(ct).width;x.fillText(ct,(W-cw)/2,by+bh+H*0.02);
  return c;
}

async function printProductLabels(L,size,showPrice){
  const dl=await fsApp.use("downloads");
  if(!dl){toast("ดาวน์โหลดไฟล์ไม่ได้ในหน้านี้");return false}
  try{await loadJsPDF()}catch(_){toast("โหลดตัวสร้าง PDF ไม่สำเร็จ ลองใหม่");return false}
  try{await document.fonts.load(`700 40px "IBM Plex Sans Thai"`);await document.fonts.load(`600 40px "IBM Plex Sans Thai"`)}catch(_){}
  const {jsPDF}=window.jspdf;const seq=[];for(const l of L)for(let i=0;i<num(l.n);i++)seq.push(l.it);
  const cache={};const img=it=>cache[it.id]||(cache[it.id]=drawProductLabel(it,size,showPrice).toDataURL("image/png"));
  let pdf;
  if(size==="a4"){pdf=new jsPDF({unit:"mm",format:"a4"});seq.forEach((it,i)=>{const k=i%24;if(i&&k===0)pdf.addPage();pdf.addImage(img(it),"PNG",(k%3)*70+1,Math.floor(k/3)*37+0.5+0.5,68,36)})}
  else{pdf=new jsPDF({unit:"mm",format:[50,30],orientation:"landscape"});seq.forEach((it,i)=>{if(i)pdf.addPage([50,30],"landscape");pdf.addImage(img(it),"PNG",0,0,50,30)})}
  try{await dl.save({filename:`ป้ายสินค้า-${seq.length}ดวง-${today()}.pdf`,data:pdf.output("blob")})}
  catch(err){if(err&&err.code==="declined")return false;toast("บันทึกไฟล์ไม่สำเร็จ");return false}
  log("ปริ้นป้ายสินค้า","st",L.filter(l=>num(l.n)>0).map(l=>`${l.it.code}×${l.n}`).join(", "),LSIZES[size].name);
  toast("ได้ไฟล์ PDF แล้ว เปิดไฟล์แล้วสั่งพิมพ์ได้เลย");return true;
}

/* tabs */
const TABS={stock:["vStock",'สต็อกสินค้า<span class="mode stock">หลังร้าน</span>'],sales:["vSales",'หน้าขาย<span class="mode sales">ขายหน้าร้าน/ออนไลน์</span>'],
  orders:["vOrders",'ออเดอร์<span class="mode orders">จากแอปลูกค้า</span>']};
function setTab(t){
  if(!TABS[t])t="stock";tab=t;
  document.body.classList.toggle("sales",t==="sales");document.body.classList.toggle("orders",t==="orders");
  document.body.classList.toggle("cust",t==="cust");document.body.classList.toggle("stockv",t==="stock");
  for(const k in TABS)$(TABS[k][0]).classList.toggle("on",k===t);
  [...$("tabbar").querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("viewTitle").innerHTML=TABS[t][1];
  try{history.replaceState(null,"","#"+t)}catch(_){}
  window.scrollTo(0,0);render();
}
$("tabbar").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTab(b.dataset.tab)});
window.addEventListener("hashchange",()=>setTab(location.hash.slice(1)));

/* desktop shortcuts */
document.addEventListener("keydown",e=>{
  if(!me||!$("lock").classList.contains("hide"))return;
  if(e.key==="Escape"){if($("pscrim").classList.contains("open"))closePanel();else if($("scrim").classList.contains("open"))closeSheet();return}
  const tg=e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if($("scrim").classList.contains("open")||$("pscrim").classList.contains("open"))return;
  if(e.key==="n"||e.key==="N"){if(canWrite){e.preventDefault();setTab("stock");openSheet(null)}}
  else if(e.key==="/"){e.preventDefault();(tab==="sales"?$("sq"):$("q")).focus()}
  else if(e.key==="1")setTab("stock");else if(e.key==="2")setTab("sales");else if(e.key==="3")setTab("orders");
});

      try{await BE.B.auth.reset(e);renderLockErr("ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว (ดูในกล่องจดหมายขยะด้วย)")}catch(err){renderLockErr(authMsg(err))}};
    $("lgPw").onkeydown=e=>{if(e.key==="Enter")$("lgBtn").click()};
    return;
  }
  if(cfgStaff===undefined){box.innerHTML='<div class="logo">FS</div><p>กำลังตรวจสอบสิทธิ์…</p>';return}
  if(cfgStaff===null){
    box.innerHTML=`<div class="logo">FS</div><h2>ตั้งค่าร้านครั้งแรก</h2><p>บัญชี <b>${esc(authUser.email)}</b> จะเป็น<b>เจ้าของร้าน</b> (ผู้ดูแลสูงสุด)</p>${demo}
      <div class="f"><label>ชื่อที่จะแสดงในแอป</label><input class="inp" id="setName" placeholder="เช่น Dam"></div>
      <div class="err" id="lockErr">${esc(msg||"")}</div>
      <button class="btn primary" style="width:100%" id="setBtn">เริ่มใช้งาน</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" id="setOut">ใช้บัญชีอื่น</button>`;
    $("setOut").onclick=()=>BE.B.auth.logout();
    $("setBtn").onclick=async()=>{
      const n=$("setName").value.trim();if(!n){renderLockErr("ใส่ชื่อก่อน");return}
      $("setBtn").disabled=true;const em=authUser.email.toLowerCase();
      try{const d=await BE.claimOwner(n,{shopName:"Friendship Shop",categories:DEFAULT_CATS.slice(),shipFee:50,payWindowMin:60,lowStock:3,updatedAt:Date.now(),updatedBy:n});
        if(d){cfgStaff=d;syncAccess()}}catch(err){$("setBtn").disabled=false;renderLockErr("บันทึกไม่สำเร็จ: "+(err.message||err.code)+" — ตรวจว่ารันไฟล์ setup.sql ใน Supabase แล้ว (คู่มือ ขั้นที่ 3)");}
    };
    return;
  }
  const em=(authUser.email||"").toLowerCase();
  box.innerHTML=`<div class="logo">FS</div><h2>ยังไม่ได้รับสิทธิ์</h2><p>บัญชี <b>${esc(em)}</b> ยังไม่อยู่ในรายชื่อพนักงานของร้าน<br>ให้เจ้าของร้านไปที่ เมนู → พนักงานและสิทธิ์ แล้วเพิ่มอีเมลนี้</p>
    <div class="err">${esc(msg||"")}</div><button class="btn ghost" style="width:100%" id="nmOut">ออกจากระบบ</button>`;
  $("nmOut").onclick=()=>BE.B.auth.logout();
}
function renderLockErr(m){const el=$("lockErr");if(el)el.textContent=m}
function memberFor(email){return cfgStaff&&(cfgStaff.members||[]).find(m=>m.email===(email||"").toLowerCase())}
function syncAccess(){
  staff=(cfgStaff&&cfgStaff.members||[]).map(m=>({id:m.email,name:m.name,role:m.role,email:m.email,active:true}));
  const m=authUser&&!authUser.isAnonymous&&memberFor(authUser.email);
  if(m){
    me={id:m.email,email:m.email,name:m.name,role:m.role,owner:cfgStaff.owner===m.email};
    BE.setRole(m.role);applyAccess();
    $("meName").textContent=m.name;$("meAv").textContent=(m.name||"?").trim().charAt(0).toUpperCase();
    hideLock();startData();
  }else{me=null;applyAccess();showLock()}
  if(panelView==="staff"||panelView==="menu"||panelView==="logs")renderPanel();
}
function logout(){closeSheet();closePanel();BE&&BE.B.auth.logout()}
async function saveStaffCfg(members){
  const arr=r=>members.filter(m=>m.role===r).map(m=>m.email);
  const admins=arr("admin");if(!admins.includes(cfgStaff.owner)){toast("เจ้าของร้านต้องเป็นผู้ดูแลเสมอ");return false}
  const d=await BE.saveStaff(members);if(d){cfgStaff=d;syncAccess()}
  return true;
}
function readOnly(){baseWrite=false;applyAccess()}
const shopLink=()=>location.origin+location.pathname.replace(/admin\.html$/,"")+fsConnParams();
const staffLink=()=>location.origin+location.pathname+fsConnParams();

/* ---------- boot ---------- */
fillCatSelects();
setTab(location.hash.slice(1)||"stock");
showLock();
document.addEventListener("be-error",e=>{
  if(e.detail&&e.detail.code==="no-config"){
    $("lockbox").innerHTML=`<div class="logo">FS</div><h2>ตั้งค่าการเชื่อมต่อครั้งแรก</h2><p>Supabase → Project Settings → API Keys / Data API</p>
      <div class="f"><label>Project URL</label><input class="inp" id="cu" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocomplete="off"></div>
      <div class="f"><label>Publishable key (sb_publishable_…) หรือ anon key</label><input class="inp" id="ck" autocapitalize="off" autocomplete="off"></div>
      <div class="err" id="lockErr"></div><button class="btn primary" style="width:100%" id="cs">บันทึกและเชื่อมต่อ</button>`;
    $("cs").onclick=()=>{const u=$("cu").value.trim().replace(/\/$/,""),k=$("ck").value.trim();
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)||k.length<20){renderLockErr("URL หรือ key ไม่ถูกต้อง ตรวจอีกครั้ง");return}
      fsLS.s("fs_sb_u",u);fsLS.s("fs_sb_k",k);location.reload()};
    return;
  }
  $("lockbox").innerHTML='<div class="logo">FS</div><h2>เชื่อมต่อไม่สำเร็จ</h2><p>โหลดระบบฐานข้อมูลไม่ได้ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้านี้</p>'});
(async()=>{
  BE=await window.__beReady;
  db=await fsApp.use("db");assets=await fsApp.use("assets");
  BE.B.auth.onChange(u=>{
    authUser=u;
    if(unsubCfg){unsubCfg();unsubCfg=null}
    if(!u||u.isAnonymous){cfgStaff=undefined;me=null;applyAccess();showLock();return}
    cfgStaff=undefined;renderLock();
    unsubCfg=BE.B.store.watchDoc("config/staff",s=>{cfgStaff=s.exists?s.data:null;if(!cfgStaff){me=null;showLock();return}syncAccess()},
      err=>{cfgStaff=undefined;showLock();renderLock("อ่านข้อมูลสิทธิ์ไม่ได้: "+(err.message||err.code)+" — ตรวจว่ารันไฟล์ setup.sql ใน Supabase แล้ว")});
  });
})();
function startData(){
  if(started)return;started=true;
  const timer=setTimeout(()=>note("ยังโหลดข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรอสักครู่"),10000);
  const onErr=err=>{clearTimeout(timer);note("โหลดข้อมูลไม่สำเร็จ ("+(err&&(err.code||err.message)||"error")+")")};
  db.doc("settings/app").onSnapshot(d=>{
    settingsExists=d.exists;
    if(d.exists){appSettings={...d.data()};if(Array.isArray(appSettings.categories)){cats=appSettings.categories.slice();fillCatSelects()}render();if(panelView==="cats")renderPanel()}
  },onErr);
  db.collection("items").orderBy("createdAt","desc").limit(2000).onSnapshot(snap=>{
    items=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){clearTimeout(timer);note("")}
    render();if(panelView==="cats")renderPanel();
  },onErr);
  db.collection("orders").orderBy("createdAt","desc").limit(500).onSnapshot(snap=>{
    orders=snap.docs.map(d=>({id:d.id,...d.data()}));renderOrders();autoCancel();
    if(panelView==="order")renderPanel();
  },onErr);
  db.collection("sales").orderBy("at","desc").limit(3000).onSnapshot(snap=>{
    sales=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  },onErr);
  db.collection("logs").orderBy("at","desc").limit(500).onSnapshot(snap=>{
    logs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(panelView==="logs")renderPanel();
  },onErr);
}

/* ---------- images (loaded from the database on demand) ---------- */
const imgCache={},imgPending=new Set();
function applyImg(el,url){if(el.tagName==="IMG")el.src=url;else el.style.backgroundImage=url?`url('${url}')`:"";el.dataset.loaded="1"}
function hydrateImgs(root){
  (root||document).querySelectorAll("[data-img]:not([data-loaded])").forEach(el=>{
    const k=el.dataset.img;if(imgCache[k]!==undefined){applyImg(el,imgCache[k]);return}
    if(imgPending.has(k))return;imgPending.add(k);
    BE&&BE.fetchImage(k).then(u=>{imgCache[k]=u||"";imgPending.delete(k);document.querySelectorAll(`[data-img="${CSS.escape(k)}"]`).forEach(x=>applyImg(x,imgCache[k]))}).catch(()=>{imgPending.delete(k)});
  });
}
new MutationObserver(()=>hydrateImgs()).observe(document.body,{childList:true,subtree:true});
})();
</script>
