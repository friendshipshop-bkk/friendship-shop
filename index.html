<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friendship Shop</title>
<meta name="description" content="Friendship Shop — สินค้าพร้อมส่ง สั่งง่ายในแอป">
<meta name="theme-color" content="#e0567a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Friendship Shop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#e0567a;--pink-d:#c23d62;--ink:#1f1d1a;--muted:#7a746a;--line:#ece6da;--bg:#fff;--soft:#faf7f0;--green:#1e8e5a;--amber:#c27c00;--red:#c63d2f;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:#f6f2ea;color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--pink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header .logo{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--pink);display:grid;place-items:center;font-weight:700;flex:none}
header .nm{flex:1;min-width:0}
header b{display:block;font-size:17px;line-height:1.2}
header small{opacity:.85;font-size:12px}
header a.line{background:#06c755;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;white-space:nowrap}
main{padding:14px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:none;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.bottom button .i{font-size:21px;line-height:1.1}
nav.bottom button.on{color:var(--pink-d)}
nav.bottom .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}
.inp{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.vopt{margin:12px 0 4px}.vopt .lb{font-size:13px;color:var(--muted);margin-bottom:6px}.vopt .row{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.vchip.on{border:2px solid var(--pink);background:#fde6ec;color:var(--pink-d);padding:6px 13px;font-weight:600}
.vchip.out{color:#b5afa5;border-style:dashed;text-decoration:line-through}
.vchip.soft{color:#9a9184;border-style:dashed;background:#faf7f0}.vchip.soft.on{color:var(--pink-d)}
.vleft{font-size:13px;color:var(--muted);margin:6px 0 2px}
.qr{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;margin:10px 0}
.qr .pp{display:inline-block;background:#113566;color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:3px 10px;margin-bottom:8px}
.qr img{width:220px;max-width:100%;height:auto;image-rendering:pixelated;display:block;margin:0 auto}
.qr .amt{font-size:22px;font-weight:700;margin-top:6px}.qr .hint{font-size:12.5px;color:var(--muted)}
.hero{background:linear-gradient(135deg,#fff1d6,#fde6ec);border-radius:16px;padding:14px;margin-bottom:12px}
.hero b{font-size:17px;display:block}.hero span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:480px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{border:none;background:none;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ph{aspect-ratio:1;border-radius:14px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;font-size:32px;color:#d0c7b5;position:relative;margin-bottom:4px}
.tagx{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.tagx.low{background:var(--pink)}
.card .t{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .d{font-size:12px;color:var(--muted)}.card .p{font-weight:700;color:var(--pink-d)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;grid-column:1/-1}
.back{border:none;background:none;color:var(--muted);cursor:pointer;padding:0 0 6px;font-size:14px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none;background:var(--soft)}
.gal::-webkit-scrollbar{display:none}
.big{flex:0 0 100%;aspect-ratio:1;max-height:min(380px,38vh);scroll-snap-align:center;background:var(--soft) center/contain no-repeat;display:grid;place-items:center;font-size:60px;color:#d0c7b5}
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#ddd3c0}.dots i.on{background:var(--pink)}
.price{font-size:22px;font-weight:700;color:var(--pink-d)}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.spec div{background:var(--soft);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;font-size:13px}.spec span{color:var(--muted);font-size:11.5px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.lineb{background:#06c755;color:#fff;width:100%;margin-top:8px;display:block;text-align:center;text-decoration:none}.btn.lineo{background:#fff;color:#06a14a;border:1.5px solid #06c755;width:100%;margin-top:8px;display:block;text-align:center;text-decoration:none}
.cta{width:100%;background:var(--pink);color:#fff;margin-top:12px;padding:14px;font-size:15.5px}
.ghost{background:#f1ece2}
.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.yellow{background:#f5b800;color:#3a2c00}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;width:max-content}
.step button{border:none;background:#f3eee4;width:36px;height:36px;font-size:17px;cursor:pointer}
.step b{min-width:38px;text-align:center}
.qty{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:600}
h2.h{font-size:17px;margin:4px 0 12px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line.gone{opacity:.5}
.line .th{width:58px;height:58px;border-radius:10px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;flex:none}
.line .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line .d{font-size:12px;color:var(--muted)}
.x{border:none;background:#f1ece2;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;flex:none}
.sum{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between}.sum .tot{font-weight:700;font-size:16px;border-top:1px dashed #ddd3c0;padding-top:6px;margin-top:2px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f label{font-size:12.5px;color:var(--muted)}
textarea.inp{min-height:90px;resize:vertical}
.bank{border:1.5px solid #f3c6d3;background:#fff7f9;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bank .acc{font-size:21px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slip{border:1.5px dashed #d8cfbd;border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);background:var(--soft) center/contain no-repeat;min-height:58px}
.slip.has{min-height:200px;display:flex;align-items:flex-end;justify-content:center}.slip.has span{background:#fff;padding:4px 10px;border-radius:999px;font-size:12.5px}
.warn{background:#fff4dc;border:1px solid #f1dfa6;color:#7a5200;border-radius:10px;padding:8px 11px;font-size:13px;margin:8px 0}
.ok{background:#e3f4ea;border:1px solid #bfe3cd;color:#145c3b;border-radius:10px;padding:8px 11px;font-size:13px;margin:8px 0}
.done{text-align:center;padding:20px 6px}.done .big2{font-size:54px}.done h2{margin:6px 0}
.code{font-size:22px;font-weight:700;letter-spacing:1px;background:var(--soft);border-radius:12px;padding:10px;margin:6px 0 10px}
.order{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.order .ot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600}
.steps{display:flex;margin:10px 0}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);position:relative;text-align:center}
.stp i{width:14px;height:14px;border-radius:50%;background:#e4ddce;display:block;z-index:1}
.stp:not(:first-child)::before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:#e4ddce}
.stp.done i,.stp.done:not(:first-child)::before{background:var(--green)}.stp.done{color:var(--ink)}
.track{background:#e3f4ea;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.install{background:#1f1d1a;color:#fff;border-radius:14px;padding:11px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.install .btn{background:#fff;color:var(--ink);flex:none}
.install .x{background:rgba(255,255,255,.15);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.demo{background:#e7eef8;color:#24508a;font-size:12px;padding:6px 14px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="demo" id="demoBar" style="display:none">🧪 โหมดตัวอย่าง — ยังไม่ได้เชื่อมฐานข้อมูลจริง</div>
  <header><div class="logo">FS</div><div class="nm"><b id="shopName">Friendship Shop</b><small>สินค้าพร้อมส่ง 💕</small></div><a class="line" id="lineBtn" href="#" target="_blank" rel="noopener" style="display:none">LINE</a></header>
  <main id="view"><div class="empty">กำลังโหลด…</div></main>
  <nav class="bottom" id="nav">
    <button data-go="home" class="on"><span class="i">🏠</span>หน้าร้าน</button>
    <button data-go="cart"><span class="i">🛒</span>ตะกร้า<span class="bd" id="cartBd" style="display:none"></span></button>
    <button data-go="orders"><span class="i">📦</span>ออเดอร์ของฉัน<span class="bd" id="ordBd" style="display:none"></span></button>
  </nav>
</div>
<input type="file" id="slipFile" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const LINE_OA="@083uwdkm";
function paidLineText(o){
  const L=["🛒 ออเดอร์ใหม่ · โอนเงินแล้วค่ะ","เลขออเดอร์ "+o.code];
  (o.items||[]).forEach(i=>L.push("- "+i.name+((num(i.qty)||1)>1?" ×"+i.qty:"")));
  L.push("ยอดรวม "+baht(o.total));if(o.name)L.push("ชื่อ "+o.name);L.push("📎 แนบสลิปในแอปแล้ว");
  return L.join("\n")}
function lineMsg(t){return "https://line.me/R/oaMessage/"+encodeURIComponent(LINE_OA)+"/?"+encodeURIComponent(t)}

/* ===== การเชื่อมต่อ Supabase =====
   ใส่ค่าตรงนี้ได้ (Project URL / anon public key) หรือเว้นไว้แล้วกรอกในหน้าแอปครั้งแรกก็ได้ */
const FS_BAKED_URL="https://ltqkshjaqvnxgqzvwzji.supabase.co", FS_BAKED_KEY="sb_publishable_AKvoAdYct_xk5jcVBsfo4w_lTt38L1M";
const fsLS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function fsConn(){
  if(!/YOUR-PROJECT/.test(FS_BAKED_URL)&&!/YOUR-ANON/.test(FS_BAKED_KEY))return {url:FS_BAKED_URL,key:FS_BAKED_KEY,baked:true};
  try{const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));
    const u=q.get("u")||h.get("u"),k=q.get("k")||h.get("k");if(u&&k){fsLS.s("fs_sb_u",u);fsLS.s("fs_sb_k",k)}}catch(e){}
  const url=fsLS.g("fs_sb_u"),key=fsLS.g("fs_sb_k");return url&&key?{url,key,baked:false}:null;
}
function fsConnParams(){const c=fsConn();return c&&!c.baked?"?u="+encodeURIComponent(c.url)+"&k="+encodeURIComponent(c.key):""}
(function(){
const DEMO=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const baht=n=>"฿"+Math.round(num(n)).toLocaleString("th-TH");
const when=t=>t?new Date(t).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2600)}
const OS={pending:"รอชำระเงิน",checking:"แจ้งโอนแล้ว รอตรวจ",paid:"ชำระแล้ว กำลังแพ็ก",packed:"แพ็กแล้ว รอส่ง",shipped:"จัดส่งแล้ว",done:"ได้รับสินค้าแล้ว",cancelled:"ยกเลิก"};
const OFLOW=["pending","checking","paid","packed","shipped","done"];
const OCOLOR={pending:"#c27c00",checking:"#2f6fb3",paid:"#7a4fc0",packed:"#0f7f8a",shipped:"#1e8e5a",done:"#5c5850",cancelled:"#c63d2f"};
const opill=s=>`<span class="pill" style="background:${OCOLOR[s]}1a;color:${OCOLOR[s]}">${OS[s]||s}</span>`;

let sb=null, settings={}, products=[], myOrders=[];
let myPairs=LS.get("fs:my",[]);const saveMy=()=>LS.set("fs:my",myPairs);
const camel=k=>k==="descr"?"desc":k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
const fromRow=r=>{const o={};for(const k in r)o[camel(k)]=r[k];o.price=Number(o.price)||0;return o};
const st={view:"home",cat:"",q:"",detail:null,dq:1,slip:null,lastCode:null,busy:false};
let cart=LS.get("fs:cart",[]), form=LS.get("fs:form",{name:"",phone:"",address:"",note:""});
const saveCart=()=>{LS.set("fs:cart",cart);badges()};
const avail=p=>Math.max(0,num(p.qty)-num(p.reserved));
const vlist=p=>Array.isArray(p&&p.variants)?p.variants:[];
const hasV=p=>vlist(p).length>0;
const vtrim=x=>(x||"").trim();
const vlabel=v=>[vtrim(v.size),vtrim(v.color)].filter(Boolean).join(" · ");
const vavail=v=>Math.max(0,num(v.qty)-num(v.reserved));
const vfind=(p,id)=>vlist(p).find(v=>v.id===id)||null;
/* stock that can still be bought for a cart line (option-level when the product has options) */
function lavail(p,vid){if(!p)return 0;if(hasV(p)){const v=vfind(p,vid);return v?vavail(v):0}return avail(p)}
const lkey=l=>l.id+"|"+(l.vid||"");
/* PromptPay QR (EMVCo) with the exact amount */
function ppTarget(id){const d=String(id||"").replace(/\D/g,"");
  if(d.length===10&&d[0]==="0")return ["01","0066"+d.slice(1)];
  if(d.length===13)return ["02",d];if(d.length===15)return ["03",d];return null}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function ppPayload(id,amount){const t=ppTarget(id);if(!t)return null;
  const f=(k,v)=>k+String(v.length).padStart(2,"0")+v;
  const amt=Number(amount)>0?f("54",Number(amount).toFixed(2)):"";
  const p=f("00","01")+f("01",amt?"12":"11")+f("29",f("00","A000000677010111")+f(t[0],t[1]))+f("58","TH")+f("53","764")+amt+"6304";
  return p+crc16(p)}
function qrHTML(amount,code){const pl=ppPayload(settings.promptpay,amount);if(!pl||!window.qrcode)return "";
  try{const q=qrcode(0,"M");q.addData(pl);q.make();
    return `<div class="qr"><span class="pp">PromptPay พร้อมเพย์</span><img src="${q.createDataURL(6,4)}" alt="QR พร้อมเพย์ ยอด ${baht(amount)}">
      <div class="amt">${baht(amount)}</div><div class="hint">${code?"ออเดอร์ "+esc(code)+" · ":""}สแกนด้วยแอพธนาคาร ยอดเงินขึ้นให้อัตโนมัติ<br>หรือกดค้างที่รูปเพื่อบันทึก แล้วเปิดจากแอพธนาคาร</div>
      ${settings.ppName?`<div class="hint" style="margin-top:4px">ชื่อบัญชี: ${esc(settings.ppName)}</div>`:""}</div>`}catch(_){return ""}}
/* option keys: sizes compared without case (2XL = 2Xl), shown in the usual size order */
const SZ=["XXS","XS","S","M","L","XL","XXL","2XL","XXXL","3XL","4XL","5XL","6XL","FREE","FREESIZE"];
const skey=v=>vtrim(v.size).toUpperCase(),ckey=v=>vtrim(v.color);
function szSort(a,b){const A=a.replace(/\s/g,""),B=b.replace(/\s/g,"");const ia=SZ.indexOf(A),ib=SZ.indexOf(B);
  if(ia>=0&&ib>=0)return ia-ib;const na=parseFloat(A),nb=parseFloat(B);if(!isNaN(na)&&!isNaN(nb))return na-nb;if(ia>=0)return -1;if(ib>=0)return 1;return 0}
function vstate(p){
  const vs=vlist(p),sizes=[...new Set(vs.map(skey).filter(Boolean))].sort(szSort),colors=[...new Set(vs.map(ckey).filter(Boolean))];
  const v=vs.find(x=>skey(x)===(st.vs||"")&&ckey(x)===(st.vc||""))||null;
  return {vs,sizes,colors,v};
}
function vinit(p){
  const vs=vlist(p);if(!vs.length){st.vs=st.vc="";return}
  const f=vs.find(v=>vavail(v)>0)||vs[0];st.vs=skey(f);st.vc=ckey(f);
}
function vselect(p,dim,val){
  const vs=vlist(p),K=dim==="s"?skey:ckey,O=dim==="s"?ckey:skey;
  const keep=dim==="s"?st.vc:st.vs;if(dim==="s")st.vs=val;else st.vc=val;
  if(vs.find(v=>K(v)===val&&O(v)===keep&&vavail(v)>0))return;
  const f=vs.find(v=>K(v)===val&&vavail(v)>0)||vs.find(v=>K(v)===val);if(f){if(dim==="s")st.vc=ckey(f);else st.vs=skey(f)}
}
const lowOf=p=>p.low!=null&&p.low!==""?num(p.low):(settings.lowStock!=null?num(settings.lowStock):3);
const payWin=()=>settings.payWindowMin!=null?Math.max(5,num(settings.payWindowMin)):60;

function leftText(o){const ms=expiresOf(o)-Date.now();if(ms<=0)return "หมดเวลาแล้ว";const m=Math.ceil(ms/60000);return m>=60?`${Math.floor(m/60)} ชม. ${m%60} นาที`:`${m} นาที`}
const img=(id,kind)=>id?`data-img="${kind}:${esc(id)}"`:"";

/* ---------- images on demand ---------- */
const imgCache={};
function imgUrl(k){if(imgCache[k])return imgCache[k];const i=k.indexOf(":"),kind=k.slice(0,i),id=k.slice(i+1);
  return imgCache[k]=sb.storage.from("fs-products").getPublicUrl(id+(kind==="t"?"_t.jpg":".jpg")).data.publicUrl}
function applyImg(el,u){if(el.tagName==="IMG")el.src=u;else{el.style.backgroundImage=u?`url('${u}')`:"";if(u)el.textContent=el.textContent.replace("📦","")}el.dataset.loaded="1"}
function hydrate(){if(!sb)return;document.querySelectorAll("[data-img]:not([data-loaded])").forEach(el=>applyImg(el,imgUrl(el.dataset.img)))}
new MutationObserver(hydrate).observe(document.body,{childList:true,subtree:true});

/* ---------- navigation ---------- */
function go(v,extra){Object.assign(st,extra||{});st.view=v;
  try{history.replaceState(null,"",v==="detail"&&st.detail?"#p-"+st.detail:v==="home"?location.pathname:"#"+v)}catch(_){}
  render();window.scrollTo(0,0)}
$("nav").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
function badges(){const n=cart.reduce((s,l)=>s+l.qty,0);$("cartBd").textContent=n;$("cartBd").style.display=n?"":"none";
  const p=myOrders.filter(o=>o.status==="pending").length;$("ordBd").textContent=p;$("ordBd").style.display=p?"":"none";
  [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.go===st.view||(b.dataset.go==="cart"&&st.view==="checkout")||(b.dataset.go==="home"&&st.view==="detail")))}

/* ---------- install prompt ---------- */
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;render()});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function installHTML(){
  if(standalone()||LS.get("fs:noinstall",false))return "";
  if(deferredInstall)return `<div class="install"><span style="flex:1">📲 ติดตั้งแอปร้านไว้บนหน้าจอ สั่งซื้อและดูสถานะง่ายขึ้น</span><button class="btn sm" data-install>ติดตั้ง</button><button class="x" data-noinstall>✕</button></div>`;

  return "";
}

async function shrinkToDataURL(file,max,q){const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
let slipFor=null;
$("slipFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;try{data=await shrinkToDataURL(f,1100,0.75)}catch(_){toast("อ่านรูปไม่ได้ ลองรูปอื่น");return}
  if(!slipFor){st.slip=data;render();return}
  const code=slipFor;slipFor=null;toast("กำลังส่งสลิป…");
  try{await sendSlip(code,data);st.slipSent=code;render();toast("ส่งสลิปแล้ว รอร้านตรวจสอบ")}catch(err){toast("ส่งสลิปไม่สำเร็จ ลองใหม่");console.error(err)}
});
async function sendSlip(code,dataUrl){
  const pair=myPairs.find(p=>p.code===code);if(!pair)throw new Error("no pair");
  const blob=await (await fetch(dataUrl)).blob();const path=code+"/"+Date.now()+".jpg";
  const up=await sb.storage.from("fs-slips").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
  const r=await sb.rpc("fs_attach_slip",{p_code:code,p_phone:pair.phone,p_path:path});if(r.error)throw r.error;
  await loadMine();
}
function copy(t,label){try{navigator.clipboard.writeText(t).then(()=>toast((label||"")+"คัดลอกแล้ว"),()=>toast(t))}catch(_){toast(t)}}
function genCode(){const d=new Date();const ymd=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="";for(const x of crypto.getRandomValues(new Uint8Array(4)))r+=ch[x%ch.length];return "FS"+ymd+"-"+r}
$("view").addEventListener("click",async e=>{
  const t=e.target.closest("[data-qr],[data-vd],[data-go],[data-cat],[data-p],[data-dq],[data-add],[data-rm],[data-cq],[data-order],[data-slip],[data-copy],[data-install],[data-noinstall],[data-sharep],[data-find],#slipBox");if(!t)return;
  if(t.hasAttribute("data-find")){const c=$("fcode").value.trim().toUpperCase(),ph=$("fphone").value.trim();if(!c||!ph){toast("ใส่เลขออเดอร์และเบอร์โทร");return}
    const r=await sb.rpc("fs_my_orders",{p_pairs:[{code:c,phone:ph}]});if(r.error||!r.data||!r.data.length){toast("ไม่พบออเดอร์ ตรวจเลขออเดอร์และเบอร์โทรอีกครั้ง");return}
    if(!myPairs.some(p=>p.code===c))myPairs.push({code:c,phone:ph});saveMy();await loadMine();toast("พบออเดอร์แล้ว");return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.cat!==undefined){st.cat=t.dataset.cat;render();return}
  if(t.dataset.qr){st.qrFor=t.dataset.qr;render();return}
  if(t.dataset.vd){const p=products.find(x=>x.id===st.detail);if(p){vselect(p,t.dataset.vd,t.dataset.vv);st.dq=1;render()}return}
  if(t.dataset.p){const p=products.find(x=>x.id===t.dataset.p);if(p)vinit(p);go("detail",{detail:t.dataset.p,dq:1});return}
  if(t.dataset.dq){st.dq+=+t.dataset.dq;render();return}
  if(t.dataset.add){const p=products.find(x=>x.id===t.dataset.add);if(!p)return;const vid=hasV(p)?(t.dataset.vid||""):"";
    if(hasV(p)&&!vfind(p,vid)){toast("เลือกไซซ์/สีก่อน");return}
    const l=cart.find(x=>x.id===p.id&&(x.vid||"")===vid);const inC=l?l.qty:0,a=lavail(p,vid);
    if(inC>=a){go("cart");return}const n=Math.min(st.dq,a-inC);if(l)l.qty+=n;else cart.push(vid?{id:p.id,vid,qty:n}:{id:p.id,qty:n});saveCart();toast(`ใส่ตะกร้า ${n} ชิ้นแล้ว`);st.dq=1;render();return}
  if(t.dataset.cq){const l=cart.find(x=>lkey(x)===t.dataset.cq);const p=l&&products.find(x=>x.id===l.id);if(!l||!p)return;l.qty=Math.max(1,Math.min(lavail(p,l.vid)||1,l.qty+(+t.dataset.d)));saveCart();render();return}
  if(t.dataset.rm){cart=cart.filter(x=>lkey(x)!==t.dataset.rm);saveCart();render();return}
  if(t.dataset.copy){copy(t.dataset.copy);return}
  if(t.dataset.sharep){copy(location.origin+location.pathname+fsConnParams()+"#p-"+t.dataset.sharep,"ลิงก์สินค้า ");return}
  if(t.hasAttribute("data-install")){deferredInstall.prompt();deferredInstall=null;render();return}
  if(t.hasAttribute("data-noinstall")){LS.set("fs:noinstall",true);render();return}
  if(t.id==="slipBox"){slipFor=null;$("slipFile").click();return}
  if(t.dataset.slip){slipFor=t.dataset.slip;$("slipFile").click();return}
  if(t.hasAttribute("data-order"))placeOrder();
});
async function placeOrder(){
  const f=form;
  if(!f.name.trim()||!f.phone.trim()||!f.address.trim()){toast("กรอกชื่อ เบอร์โทร และที่อยู่ให้ครบ");return}
  if(f.phone.replace(/\D/g,"").length<9){toast("เบอร์โทรไม่ถูกต้อง");return}
  st.busy=true;render();
  try{
    const r=await sb.rpc("fs_place_order",{p_items:cart.map(l=>(l.vid?{id:l.id,vid:l.vid,qty:l.qty}:{id:l.id,qty:l.qty})),p_name:f.name.trim(),p_phone:f.phone.trim(),p_address:f.address.trim(),p_note:(f.note||"").trim()});
    if(r.error)throw r.error;const res=r.data||{};
    if(!res.ok){st.busy=false;toast("สินค้าในตะกร้าหมดแล้ว");await loadProducts();go("cart");return}
    const code=res.code;myPairs.unshift({code,phone:f.phone.trim()});saveMy();
    if(st.slip){try{await sendSlip(code,st.slip)}catch(_){toast("ส่งสลิปไม่สำเร็จ แนบใหม่ได้ในออเดอร์ของฉัน")}}
    cart=[];saveCart();st.slip=null;st.busy=false;st.lastCode=code;await loadMine();go("done");
    if(res.short)toast("บางรายการมีของไม่พอ ระบบสั่งเท่าที่มีให้แล้ว");loadProducts();
  }catch(err){console.error(err);st.busy=false;toast("สั่งซื้อไม่สำเร็จ ลองใหม่อีกครั้ง");render()}
}
async function loadProducts(){const r=await sb.from("fs_products").select("*").eq("active",true);if(r.error){console.error(r.error);return}
  products=r.data.map(fromRow);if(!(st.view==="checkout"&&document.activeElement&&document.activeElement.classList.contains("cf")))render()}
async function loadSettings(){const r=await sb.from("fs_config").select("data").eq("id","app").maybeSingle();settings=(r.data&&r.data.data)||{};
  $("shopName").textContent=settings.shopName||"Friendship Shop";document.title=settings.shopName||"Friendship Shop";
  const lb=$("lineBtn");lb.href=settings.lineUrl||("https://line.me/R/ti/p/"+encodeURIComponent(LINE_OA));lb.style.display="";render()}
async function loadMine(){if(!myPairs.length){myOrders=[];return}const r=await sb.rpc("fs_my_orders",{p_pairs:myPairs.slice(0,40)});
  if(!r.error){myOrders=r.data||[];if(st.view!=="checkout")render();else badges()}}
/* ---------- start ---------- */
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
(async()=>{
  const c=fsConn();
  if(!c||!window.supabase){$("view").innerHTML='<div class="empty">ร้านยังไม่ได้ตั้งค่าแอป<br>กรุณาเปิดจากลิงก์ที่ร้านส่งให้</div>';return}
  sb=supabase.createClient(c.url,c.key,{auth:{persistSession:false}});
  const m=/#p-([^&]+)/.exec(location.hash);if(m){st.view="detail";st.detail=decodeURIComponent(m[1])}
  else if(["#cart","#orders","#checkout"].includes(location.hash))st.view=location.hash.slice(1);
  sb.rpc("fs_auto_cancel").then(()=>{},()=>{});
  await Promise.all([loadSettings(),loadProducts()]);loadMine();
  try{sb.channel("cust").on("postgres_changes",{event:"*",schema:"public",table:"fs_products"},()=>{clearTimeout(window.__pt);window.__pt=setTimeout(loadProducts,400)})
    .on("postgres_changes",{event:"*",schema:"public",table:"fs_config"},()=>loadSettings()).subscribe()}catch(_){}
  setInterval(()=>{loadMine();if(["orders","done"].includes(st.view))render()},20000);
  setInterval(loadProducts,90000);
  setInterval(()=>sb.rpc("fs_auto_cancel").then(()=>{},()=>{}),300000);
})();
})();
</script>
